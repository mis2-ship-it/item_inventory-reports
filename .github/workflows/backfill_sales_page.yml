name: Daily COCO Sales Page Sync

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional date (YYYY-MM-DD). Defaults to today minus 1 day.'
        required: false
        default: ''
      backfill_mode:
        description: 'Fetch mode'
        required: false
        default: 'DAILY_YESTERDAY'
        type: choice
        options:
          - DAILY_YESTERDAY
          - SINGLE_DATE
          - FROM_NOV_26_TO_DATE

permissions:
  contents: write

jobs:
  daily-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas pyjwt gspread google-auth

      - name: Run COCO Sales Page Sync
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          BACKFILL_MODE: ${{ github.event.inputs.backfill_mode || 'DAILY_YESTERDAY' }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          if [ -n "${TARGET_DATE}" ] && [ "${BACKFILL_MODE}" = "SINGLE_DATE" ]; then
            if [[ ! "${TARGET_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "TARGET_DATE must use YYYY-MM-DD format"
              exit 1
            fi
          fi
          python backfill_sales_page.py

      - name: Commit and push updated sales data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily COCO sales sync ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
