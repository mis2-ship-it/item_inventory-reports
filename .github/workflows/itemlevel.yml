name: Hourly Item Level Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # hourly (UTC)

permissions:
  contents: write

jobs:

  run-script:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Item Level Report
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

        run: |
          echo "Running Item Level Report..."
          python item_level.py

      - name: Commit live dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data/live_item_level.csv dashboard_data/live_index.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No live dashboard changes to commit."
          else
            git commit -m "Refresh live item-level dashboard data"
            git push
          fi
