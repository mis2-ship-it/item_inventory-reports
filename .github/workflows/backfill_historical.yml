name: Daily COCO Sales Page Sync

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional specific date (YYYY-MM-DD). Leave blank for yesterday (IST).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  daily-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas pyjwt gspread google-auth

      - name: Fetch Latest Date COCO Sales Page Data
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: python daily_sales_page_sync.py

      - name: Commit and Push Daily Update to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historical_data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily COCO sales/page sync ($(date -u +'%Y-%m-%d'))"
          git push
