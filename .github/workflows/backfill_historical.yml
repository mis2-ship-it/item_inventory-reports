name: Backfill Historical Sales Page Data (COCO)

on:
  workflow_dispatch:
    inputs:
      backfill_mode:
        description: 'Select Backfill Range (Run NOV_2026 first to verify, then APR_2026_TO_DATE)'
        required: true
        default: 'NOV_2026'
        type: choice
        options:
          - NOV_2026
          - APR_2026_TO_DATE

permissions:
  contents: write

jobs:
  backfill-coco-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas pyjwt gspread google-auth

      - name: Run Sales Page Backfill (COCO Only)
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          BACKFILL_MODE: ${{ github.event.inputs.backfill_mode }}
        run: python backfill_sales_page.py

      - name: Commit and Push Updated CSVs to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historical_data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Backfill COCO sales/page historical data (${{ github.event.inputs.backfill_mode }})"
          git push
