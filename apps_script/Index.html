<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root{--navy:#19385c;--blue:#dceaf7;--ink:#17324f;--muted:#64748b;--bg:#f3f6fa;--line:#d9e2ec;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}
    header{background:var(--navy);color:white;padding:20px 24px}h1{font-size:25px;margin:0 0 7px}header p{margin:0;opacity:.9}
    main{padding:18px;max-width:1800px;margin:auto}.filters{background:white;padding:16px;border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;align-items:end}
    label{display:block;font-weight:700;font-size:12px;margin-bottom:6px;color:#52657a}select,input{width:100%;padding:10px;border:1px solid #c8d5e3;border-radius:6px;background:#fff;color:var(--ink)}
    button{padding:10px 16px;border:0;border-radius:6px;background:var(--navy);color:white;font-weight:700;cursor:pointer}button.secondary{background:#e5edf6;color:var(--navy);border:1px solid #c8d5e3}
    .actions{display:flex;gap:8px}.status{background:white;border:1px solid var(--line);padding:11px 14px;border-radius:8px;margin:12px 0;color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;margin:14px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:15px;min-width:0}
    .klabel{color:var(--muted);font-size:12px;font-weight:700}.kvalue{font-size:23px;font-weight:700;margin-top:8px;white-space:nowrap}.sub{color:var(--muted);font-size:12px;margin-top:5px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.panel h2{font-size:17px;margin:0 0 12px}.panel h3{font-size:15px;margin:0 0 10px}
    .tablewrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:6px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #e4ebf2;text-align:right}th{position:sticky;top:0;background:var(--blue);z-index:1;color:#163452}td:first-child,th:first-child{text-align:left}tbody tr:nth-child(even){background:#f8fafc}
    .bars{display:flex;flex-direction:column;gap:9px}.barrow{display:grid;grid-template-columns:92px 1fr 100px;gap:8px;align-items:center;font-size:12px}.barbg{height:16px;background:#e8eef5;border-radius:4px;overflow:hidden}.bar{height:100%;background:#3979b8;border-radius:4px}.barval{text-align:right;font-variant-numeric:tabular-nums}
    .warning{color:#9b4b00}.small{font-size:12px;color:var(--muted)}.hidden{display:none}
    @media(max-width:1100px){.filters{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:650px){main{padding:10px}.filters{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}header{padding:16px}.kvalue{font-size:20px}}
  </style>
</head>
<body>
<header>
  <h1>Product Level Dashboard</h1>
  <p>Frozen Bottle | COCO | Live and Historical Product Analysis</p>
</header>
<main>
  <section class="filters">
    <div><label for="brand">Brand</label><select id="brand"><option value="">All Brands</option></select></div>
    <div><label for="region">Region</label><select id="region"><option value="">All Regions</option></select></div>
    <div><label for="category">Category</label><select id="category"><option value="">All Categories</option></select></div>
    <div><label for="month">Month</label><select id="month"><option value="">Custom date range</option></select></div>
    <div><label for="fromDate">From Date</label><input id="fromDate" type="date"></div>
    <div><label for="toDate">To Date</label><input id="toDate" type="date"></div>
    <div style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button onclick="applyFilters()">Apply Filters</button><button class="secondary" onclick="resetFilters()">Reset</button>
      <span id="metaText" class="small"></span>
    </div>
  </section>
  <div id="status" class="status">Connecting to GitHub data files…</div>
  <section id="kpis" class="cards"></section>
  <section class="grid2">
    <div class="panel"><h2>Daily Net Revenue Trend</h2><div id="trend" class="bars"></div></div>
    <div class="panel"><h2>Brand Performance</h2><div id="brandTable" class="tablewrap"></div></div>
  </section>
  <section class="grid2">
    <div class="panel"><h2>Region Performance</h2><div id="regionTable" class="tablewrap"></div></div>
    <div class="panel"><h2>Category Performance</h2><div id="categoryTable" class="tablewrap"></div></div>
  </section>
  <section class="panel">
    <h2>Product Performance</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
      <input id="productSearch" placeholder="Search item, brand, region or category…" oninput="renderProducts()" style="max-width:440px">
      <span id="productCount" class="small"></span>
    </div>
    <div id="productTable" class="tablewrap"></div>
  </section>
</main>
<script>
let META=null, DATA=null;
const $=id=>document.getElementById(id);
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2,minimumFractionDigits:2})}
function number(v){return Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2})}
function escapeHtml(s){return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function addOptions(id,items,first){const el=$(id);el.innerHTML='<option value="">'+first+'</option>'+(items||[]).map(x=>'<option value="'+escapeHtml(x)+'">'+escapeHtml(x)+'</option>').join("")}
function init(){
  google.script.run.withSuccessHandler(meta=>{
    META=meta;
    addOptions("brand",meta.brands,"All Brands");
    addOptions("region",meta.regions,"All Regions");
    addOptions("category",meta.categories,"All Categories");
    const months=(meta.months||[]).slice().reverse();
    $("month").innerHTML='<option value="">Custom date range</option>'+months.map(m=>'<option value="'+m+'">'+monthLabel(m)+'</option>').join("");
    const max=meta.max_date||new Date().toISOString().slice(0,10);
    const defaultMonth=max.slice(0,7);
    $("month").value=defaultMonth;
    setMonthDates(defaultMonth);
    $("month").addEventListener("change",()=>{if($("month").value)setMonthDates($("month").value)});
    $("fromDate").addEventListener("change",()=>{$("month").value=""});
    $("toDate").addEventListener("change",()=>{$("month").value=""});
    $("metaText").textContent="History partitions: "+meta.partition_count+" | Live date: "+(meta.live_date||"not published");
    applyFilters();
  }).withFailureHandler(err=>showError(err)).getDashboardMeta();
}
function monthLabel(m){const [y,mo]=m.split("-");return new Date(Number(y),Number(mo)-1,1).toLocaleString("en-IN",{month:"long",year:"numeric"})}
function setMonthDates(m){const [y,mo]=m.split("-").map(Number);$("fromDate").value=y+"-"+String(mo).padStart(2,"0")+"-01";const last=new Date(Date.UTC(y,mo,0)).getUTCDate();$("toDate").value=y+"-"+String(mo).padStart(2,"0")+"-"+String(last).padStart(2,"0");if(META&&META.max_date&&$("toDate").value>META.max_date)$("toDate").value=META.max_date}
function resetFilters(){["brand","region","category"].forEach(id=>$(id).value="");if(META&&META.max_date){const m=META.max_date.slice(0,7);$("month").value=m;setMonthDates(m)}$("productSearch").value="";applyFilters()}
function applyFilters(){
  const filters={brand:$("brand").value,region:$("region").value,category:$("category").value,fromDate:$("fromDate").value,toDate:$("toDate").value};
  $("status").textContent="Loading records from GitHub…";
  $("status").className="status";
  document.querySelectorAll("button").forEach(b=>b.disabled=true);
  google.script.run.withSuccessHandler(data=>{
    DATA=data;renderAll();document.querySelectorAll("button").forEach(b=>b.disabled=false);
    const warnings=(data.info.warnings||[]).length;
    $("status").innerHTML="Loaded "+number(data.info.matchingRows)+" matching item lines from "+data.info.fromDate+" to "+data.info.toDate+". Live date: "+escapeHtml(data.info.liveDate||"not available")+(warnings?' <span class="warning">| Warning: '+warnings+' file(s) could not load.</span>':"");
  }).withFailureHandler(err=>{document.querySelectorAll("button").forEach(b=>b.disabled=false);showError(err)}).getDashboardData(filters);
}
function showError(err){$("status").textContent="Error: "+(err&&err.message?err.message:String(err));$("status").className="status warning"}
function renderAll(){
  const k=DATA.kpis;
  const cards=[
    ["Net Revenue",money(k.net),"AOV "+money(k.aov)],
    ["Orders",number(k.orders),"Unique invoices"],
    ["Qty Sold",number(k.qty),"Item quantity"],
    ["Gross Revenue",money(k.gross),"Before discounts"],
    ["Discount",money(k.discount),"Total discount amount"],
    ["Discount %",number(k.discountPct)+"%","Discount ÷ gross"],
    ["Item Lines",number(DATA.info.matchingRows),"Matching records"]
  ];
  $("kpis").innerHTML=cards.map(c=>'<div class="card"><div class="klabel">'+c[0]+'</div><div class="kvalue">'+c[1]+'</div><div class="sub">'+c[2]+'</div></div>').join("");
  renderTrend();renderSummary("brandTable",DATA.brands);renderSummary("regionTable",DATA.regions);renderSummary("categoryTable",DATA.categories);renderProducts();
}
function renderTrend(){
  const rows=DATA.trend||[], max=Math.max(1,...rows.map(r=>r.net));
  $("trend").innerHTML=rows.length?rows.map(r=>'<div class="barrow"><span>'+escapeHtml(r.date.slice(5))+'</span><div class="barbg"><div class="bar" style="width:'+Math.max(0,Math.min(100,r.net/max*100))+'%"></div></div><span class="barval">'+money(r.net)+'</span></div>').join(""):'<p class="small">No data for the selected period.</p>';
}
function renderSummary(id,rows){
  const subset=(rows||[]).slice(0,30);
  $(id).innerHTML=subset.length?'<table><thead><tr><th>Name</th><th>Orders</th><th>Qty</th><th>Net Revenue</th><th>Discount %</th></tr></thead><tbody>'+subset.map(r=>'<tr><td>'+escapeHtml(r.name)+'</td><td>'+number(r.orders)+'</td><td>'+number(r.qty)+'</td><td>'+money(r.net)+'</td><td>'+number(r.discountPct)+'%</td></tr>').join("")+'</tbody></table>':'<p class="small">No data for this selection.</p>';
}
function renderProducts(){
  if(!DATA)return;
  const q=$("productSearch").value.toLowerCase();
  const all=DATA.products||[];
  const rows=all.filter(r=>[r.item,r.brand,r.region,r.category].join(" ").toLowerCase().includes(q));
  $("productCount").textContent=number(rows.length)+" products";
  const shown=rows.slice(0,500);
  $("productTable").innerHTML=shown.length?'<table><thead><tr><th>Product</th><th>Brand</th><th>Region</th><th>Category</th><th>Orders</th><th>Qty</th><th>Gross</th><th>Discount</th><th>Discount %</th><th>Net Revenue</th><th>AOV</th></tr></thead><tbody>'+shown.map(r=>'<tr><td>'+escapeHtml(r.item)+'</td><td>'+escapeHtml(r.brand)+'</td><td>'+escapeHtml(r.region)+'</td><td>'+escapeHtml(r.category)+'</td><td>'+number(r.orders)+'</td><td>'+number(r.qty)+'</td><td>'+money(r.gross)+'</td><td>'+money(r.discount)+'</td><td>'+number(r.discountPct)+'%</td><td>'+money(r.net)+'</td><td>'+money(r.aov)+'</td></tr>').join("")+'</tbody></table>':'<p class="small">No products match the filters.</p>';
}
init();
</script>
</body>
</html>
