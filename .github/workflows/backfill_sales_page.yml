name: Daily COCO Sales Page Sync

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional specific date (YYYY-MM-DD). Used only in CUSTOM_MONTH mode.'
        required: false
        default: ''
      backfill_mode:
        description: 'DAILY_YESTERDAY, CUSTOM_MONTH, or APR_2026_TO_DATE'
        required: false
        default: 'DAILY_YESTERDAY'
        type: choice
        options:
          - DAILY_YESTERDAY
          - CUSTOM_MONTH
          - APR_2026_TO_DATE

permissions:
  contents: write

jobs:
  daily-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas pyjwt gspread google-auth

      - name: Run COCO Sales Page Sync
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          BACKFILL_MODE: ${{ github.event.inputs.backfill_mode || 'DAILY_YESTERDAY' }}
          CUSTOM_MONTH: ${{ github.event.inputs.target_date || '' }}
        run: |
          if [ -n "${CUSTOM_MONTH}" ] && [ "${BACKFILL_MODE}" = "CUSTOM_MONTH" ]; then
            if [[ "${CUSTOM_MONTH}" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
              export CUSTOM_MONTH="${CUSTOM_MONTH}"
            elif [[ "${CUSTOM_MONTH}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              export CUSTOM_MONTH="${CUSTOM_MONTH:0:7}"
            else
              echo "CUSTOM_MONTH must use YYYY-MM or YYYY-MM-DD format"
              exit 1
            fi
          fi
          python backfill_sales_page.py

      - name: Commit and push updated sales data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily COCO sales sync ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
