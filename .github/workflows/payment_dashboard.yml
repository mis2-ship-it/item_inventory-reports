name: Payment Mode Dashboard Automation

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  run-payment-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests PyJWT gspread google-auth numpy

      - name: Execute Payment Dashboard Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: "1ldgnNMdeubDx_ImtCC1uCD7FGz8gt_edmWEkmO_xRNk"
        run: |
          echo "Starting Standalone Payment Mode Pipeline..."
          python payment_dashboard.py
