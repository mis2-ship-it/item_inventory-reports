name: Run Item Level Historical Data

on:
  workflow_dispatch:
    inputs:
      history_start_date:
        description: "Historical start date (YYYY-MM-DD)"
        required: true
        default: "2026-07-01"
        type: string
      history_end_date:
        description: "Historical end date (YYYY-MM-DD)"
        required: true
        default: "2026-04-30"
        type: string
  schedule:
    - cron: '30 4 * * *'


permissions:
  contents: write

jobs:

  run-script:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout Repo
        uses: actions/checkout@v4

      # =====================================================
      # SETUP PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # INSTALL PACKAGES
      # =====================================================

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # RUN ITEM LEVEL HISTORY SCRIPT
      # =====================================================

      - name: Run Item Level Historical Data
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

        
        run: |
          echo "=============================================="
          echo "Running Item Level Historical Data..."
          echo "=============================================="

          if [ "${{ github.event_name }}" = "schedule" ]; then
            HISTORY_DATE=$(TZ=Asia/Kolkata date +%F)
            echo "Scheduled refresh for business date: $HISTORY_DATE"

            HISTORY_START_DATE="$HISTORY_DATE" \
            HISTORY_END_DATE="$HISTORY_DATE" \
            python item_level_history.py

          else
            echo "Manual historical refresh"
            echo "Start date: ${{ inputs.history_start_date }}"
            echo "End date: ${{ inputs.history_end_date }}"

            HISTORY_START_DATE="${{ inputs.history_start_date }}" \
            HISTORY_END_DATE="${{ inputs.history_end_date }}" \
            python item_level_history.py
          fi

      - name: Publish dashboard history partitions
        run: |
          python publish_dashboard_history.py

      # =====================================================
      # CHECK GENERATED FILES
      # =====================================================

      - name: Check Generated Historical Files
        run: |

          echo "=============================================="
          echo "Checking historical_data folder"
          echo "=============================================="

          ls -lah historical_data/

          echo ""
          echo "August file:"
          ls -lah historical_data/item_level_2026_08.csv || true
          wc -l historical_data/item_level_2026_08.csv || true

          echo ""
          echo "September file:"
          ls -lah historical_data/item_level_2026_09.csv || true

          echo ""
          echo "CSV line count:"
          wc -l historical_data/item_level_2026_09.csv || true

      # =====================================================
      # COMMIT AND PUSH CSV FILES
      # =====================================================

      - name: Commit Historical Data
        run: |

          echo "=============================================="
          echo "Committing Historical Data"
          echo "=============================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add historical_data/ dashboard_data/history/ dashboard_data/history_index.json

          echo ""
          echo "Git status:"
          git status

          if git diff --cached --quiet; then

            echo ""
            echo "ℹ️ No changes detected."

          else

            echo ""
            echo "📦 Changes detected. Creating commit..."

            git commit -m "Update item level historical data"

            echo ""
            echo "🚀 Pushing changes to GitHub..."

            git push

            echo ""
            echo "✅ Historical data pushed successfully."

          fi
