name: Daily Rista Sales Page Sync & Dashboard Cube Build

on:
  schedule:
    # Runs daily at 08:30 AM IST (03:00 AM UTC)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional specific date (YYYY-MM-DD). Leave blank for yesterday (IST)."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync-and-build-cube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas gspread google-auth pyjwt

      - name: Run Daily Rista Sales Sync
        env:
          RISTA_API_KEY: ${{ secrets.RISTA_API_KEY }}
          RISTA_SECRET_KEY: ${{ secrets.RISTA_SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          python daily_sales_page_sync.py

      - name: Build Pre-Aggregated Dashboard Cube JSON
        run: |
          python build_dashboard_cube.py

      - name: Commit and push updated CSVs & dashboard_cube.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily sales sync & dashboard_cube.json update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin main
          fi
