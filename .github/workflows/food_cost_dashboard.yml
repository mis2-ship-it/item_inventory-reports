name: Food Cost Dashboard Automation

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 09:30 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-food-cost-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests PyJWT gspread google-auth numpy

      - name: Execute Fast Food Cost Pipeline
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python food_cost_pipeline.py

      - name: Commit & Push Monthly Data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/food_cost/
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "Auto-update monthly food cost data [$(date -u +'%Y-%m-%d')]"
            git push origin main
          fi
