name: Backfill Historical Sales Page Data (COCO)

on:
  workflow_dispatch:
    inputs:
      backfill_mode:
        description: 'Backfill mode (APR_2026_TO_DATE, CUSTOM_MONTH, or DAILY_YESTERDAY)'
        required: true
        default: 'APR_2026_TO_DATE'
        type: choice
        options:
          - APR_2026_TO_DATE
          - CUSTOM_MONTH
          - DAILY_YESTERDAY
      custom_month:
        description: 'Target month (YYYY-MM) if CUSTOM_MONTH is selected (e.g. 2026-10)'
        required: false
        default: '2026-10'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas pyjwt gspread google-auth

      - name: Run Sales Page Backfill (1st to End of Month)
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          BACKFILL_MODE: ${{ github.event.inputs.backfill_mode }}
          CUSTOM_MONTH: ${{ github.event.inputs.custom_month }}
        run: python backfill_sales_page.py

      - name: Commit and Push Historical CSVs to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historical_data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Backfill COCO sales/page data (${{ github.event.inputs.backfill_mode }})"
          git push
